[package]
name = "brewery-eval"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
brewery-hash-pool = { path = "../hash-pool" }
halogen-proof = { path = "../halogen-proof" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.9"
tempfile = "3.27"
ureq = { version = "3.4.2", default-features = false, features = ["rustls", "json"] }
