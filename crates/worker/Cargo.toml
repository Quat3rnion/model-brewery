[package]
name = "brewery-worker"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "brewery-worker"
path = "src/worker.rs"

[[bin]]
name = "brewery-dispatch"
path = "src/dispatch.rs"

[dependencies]
brewery-hash-pool = { path = "../hash-pool" }
anyhow = "1"
base64 = "0.22"
bf16-to-hgn = { git = "https://github.com/Quat3rnion/bf16-to-hgn.git", rev = "eaa15cb465410c95adf355f3208a34a95d6e81b9", default-features = false }
fs2 = "0.4"
libc = "0.2"
nalgebra = { version = "0.35", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
