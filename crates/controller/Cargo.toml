[package]
name = "brewery-controller"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "brewery"
path = "src/main.rs"

[dependencies]
brewery-worker = { path = "../worker" }
axum = "0.8"
base64 = "0.22"
fs2 = "0.4"
futures-util = { version = "0.3", default-features = false }
libc = "0.2"
rusqlite = "0.37"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "process", "io-util", "sync", "time"] }
tower-http = { version = "0.6", features = ["fs"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
